name: 手动编译并发布 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: '本次发布说明'
        required: false
        default: "1. 课名/篇名自然语言直达 (免死板索引)\n2. 五维名师深度导学 (主旨推导、词句标出、写法说透、作文借鉴)\n3. 自由多轮名师互动问答室\n4. 离线标准普通话慢速伴读朗读"

permissions:
  contents: write

jobs:
  build_and_release:
    name: 编译 APK 并发布 Release (${{ inputs.version }})
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 规范化脚本换行符与权限
      run: |
        sed -i -e 's/\r$//' gradlew
        chmod +x gradlew

    - name: 执行编译打包
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      run: |
        echo ">>> 开始编译 APK..."
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: 规整并重命名 APK 产物
      run: |
        mkdir -p release_apks
        cp app/build/outputs/apk/debug/*.apk release_apks/StudentReadingAssistant-${{ inputs.version }}.apk

    - name: 上传构建产物 (Artifacts 归档备份)
      uses: actions/upload-artifact@v4
      with:
        name: StudentReadingAssistant-${{ inputs.version }}
        path: release_apks/*.apk
        retention-days: 7

    - name: 自动创建 GitHub Release 并挂载 APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        name: "中小学阅读伴读小助手 ${{ inputs.version }}"
        body: |
          ## 📖 中小学名师阅读与写作小助手正式发布
          **版本号**: `${{ inputs.version }}`

          ### 🌟 本次版本核心特性：
          ${{ inputs.release_notes }}

          ---
          ### 📱 下载与安装说明：
          1. 直接点击下方 **Assets** 列表中的 `StudentReadingAssistant-${{ inputs.version }}.apk` 进行下载；
          2. 将安装包传输至安卓手机，点击即可直接安装体验！
        files: release_apks/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
