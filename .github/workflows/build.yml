name: 手动编译并发布 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: '本次发布说明'
        required: false
        default: "1. 课名/篇名自然语言直达 (免死板索引)\n2. 五维名师深度导学 (主旨推导、词句标出、写法说透、作文借鉴)\n3. 自由多轮名师互动问答室\n4. 离线标准普通话慢速伴读朗读"

permissions:
  contents: write

jobs:
  build_and_release:
    name: 编译 APK 并发布 Release (${{ inputs.version }})
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 确保官方标准永久 Release 签名密钥存在
      run: |
        if [ ! -f app/release.keystore ]; then
          echo ">>> 正在使用 JDK 官方 keytool 生成标准永久 JKS 签名密钥..."
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias readingkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storetype JKS \
            -storepass reading123 \
            -keypass reading123 \
            -dname "CN=StudentReadingAssistant, OU=Reading, O=Assistant, C=CN"
          
          echo ">>> 自动持久化签名证书到 Git 仓库，确保后续所有构建签名绝对一致..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/release.keystore
          git commit -m "chore: persist canonical release.keystore generated by JDK keytool" || true
          git push origin main || echo "Git push skipped, using current keystore for build."
        else
          echo ">>> 检测到已存在的 release.keystore，继续使用固定签名构建。"
        fi

    - name: 规范化脚本换行符与权限
      run: |
        sed -i -e 's/\r$//' gradlew
        chmod +x gradlew

    - name: 提取版本号与单调递增版本代码
      id: ver
      run: |
        RAW_VER="${{ inputs.version }}"
        CLEAN_VER="${RAW_VER#v}"
        echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
        echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: 执行编译打包 (Release 正式签名)
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      run: |
        echo ">>> 开始编译 APK (版本名: ${{ steps.ver.outputs.clean_version }}, 版本号: ${{ steps.ver.outputs.version_code }})..."
        ./gradlew assembleRelease \
          -PversionCode=${{ steps.ver.outputs.version_code }} \
          -PversionName=${{ steps.ver.outputs.clean_version }} \
          --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            echo "==================== BUILD FAILED DIAGNOSTICS ===================="
            grep -E "e: |Caused by:|FAILURE:|BUILD FAILED" build_output.log || tail -n 120 build_output.log
            exit 1
          }

    - name: 规整并重命名 APK 产物
      run: |
        mkdir -p release_apks
        echo ">>> 当前构建产物目录："
        find app/build/outputs/ -type f || true
        APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
        if [ -n "$APK_FILE" ]; then
          echo ">>> 成功找到 APK 产物: $APK_FILE"
          cp "$APK_FILE" release_apks/StudentReadingAssistant-${{ inputs.version }}.apk
        else
          echo ">>> 错误：未检索到任何 APK 产物文件！"
          exit 1
        fi

    - name: 上传构建产物 (Artifacts 归档备份)
      uses: actions/upload-artifact@v4
      with:
        name: StudentReadingAssistant-${{ inputs.version }}
        path: release_apks/*.apk
        retention-days: 7

    - name: 自动创建 GitHub Release 并挂载 APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        name: "智能阅读伴读助手 ${{ inputs.version }}"
        body: |
          ## 📖 智能阅读伴读助手正式发布
          **版本号**: `${{ inputs.version }}`

          ### 🌟 本次版本核心特性：
          ${{ inputs.release_notes }}

          ---
          ### 📱 下载与安装说明：
          1. 直接点击下方 **Assets** 列表中的 `StudentReadingAssistant-${{ inputs.version }}.apk` 进行下载；
          2. 将安装包传输至安卓手机，点击即可直接安装体验！
        files: release_apks/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
