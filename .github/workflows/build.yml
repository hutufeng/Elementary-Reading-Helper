name: Android 手动与自动编译流水线

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '请选择打包类型'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
  push:
    branches: [ "main" ]

jobs:
  build:
    name: 编译 Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 生成兼容的 Gradle 8.4 Wrapper 并切换至高速 CDN 镜像
      run: |
        # 1. 生成 8.4 wrapper 避免 Ubuntu 默认的 9.x 引起版本不兼容
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        # 2. 切换官方源至 JetBrains 全球高速 CDN，彻底规避 services.gradle.org 504 超时
        sed -i 's|https\\://services.gradle.org|https\\://cache-redirector.jetbrains.com/services.gradle.org|g' gradle/wrapper/gradle-wrapper.properties
        chmod +x gradlew

    - name: 执行编译 (分配 4GB 内存)
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.daemon=false"
      run: |
        BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
        if [ "$BUILD_TYPE" = "release" ]; then
          echo ">>> 正在执行 Release 编译..."
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace
        else
          echo ">>> 正在执行 Debug 编译..."
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace
        fi

    - name: 归档并上传生成的 APK 安装包
      uses: actions/upload-artifact@v4
      with:
        name: student-reading-apk-${{ inputs.build_type || 'debug' }}
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
