name: Android 手动与自动编译流水线

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '请选择打包类型'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
  push:
    branches: [ "main" ]

jobs:
  build:
    name: 编译 Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 配置 Gradle 8.4 环境与依赖缓存
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 确保 Gradle Wrapper 兼容
      run: gradle wrapper --gradle-version 8.4 --distribution-type bin

    - name: 赋予 Gradle 执行权限
      run: chmod +x gradlew

    - name: 执行编译 (分配 4GB JVM 堆内存)
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
      run: |
        BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
        if [ "$BUILD_TYPE" = "release" ]; then
          echo ">>> 正在执行 Release 编译..."
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace
        else
          echo ">>> 正在执行 Debug 编译..."
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace
        fi

    - name: 归档并上传生成的 APK 安装包
      uses: actions/upload-artifact@v4
      with:
        name: student-reading-apk-${{ inputs.build_type || 'debug' }}
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
