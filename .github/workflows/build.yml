name: Android 手动与自动编译流水线

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '请选择打包类型'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
  push:
    branches: [ "main" ]

jobs:
  build:
    name: 编译 Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 规范化脚本换行符与权限
      run: |
        sed -i -e 's/\r$//' gradlew
        chmod +x gradlew

    - name: 执行编译打包 (读取 gradle.properties 4GB 内存配置)
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      run: |
        BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
        if [ "$BUILD_TYPE" = "release" ]; then
          echo ">>> 正在执行 Release 编译..."
          ./gradlew assembleRelease --no-daemon --stacktrace
        else
          echo ">>> 正在执行 Debug 编译..."
          ./gradlew assembleDebug --no-daemon --stacktrace
        fi

    - name: 归档并上传生成的 APK 安装包
      uses: actions/upload-artifact@v4
      with:
        name: student-reading-apk-${{ inputs.build_type || 'debug' }}
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
